    <script src="https://kit.fontawesome.com/8c95c978c9.js" crossorigin="anonymous" defer></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        
        // 1. POVEZAVA OBEH STIKAL (PRVO IN DODATNO OCENJEVANJE)
        const chkPrvo = document.getElementById('chk-prikazi-prvo');
        const kontejnerPrvi = document.querySelector('.prvi-krogci');
        const poljeIme = document.getElementById('polje-ime-priimek');
        const poljeDatum1 = document.getElementById('polje-datum');

        const chkDodatno = document.getElementById('chk-prikazi-dodatno');
        const kontejnerDodatni = document.querySelector('.dodatni-krogci');
        const poljeDatum2 = document.getElementById('polje-datum-2');

        // Pomožna funkcija za prikaz/skrivanje prvega sklopa in ozadja pri tisku
        function nastaviPrvo(prikazi) {
            if (kontejnerPrvi) kontejnerPrvi.style.display = prikazi ? 'block' : 'none';
            if (poljeIme) poljeIme.style.display = prikazi ? 'block' : 'none';
            if (poljeDatum1) poljeDatum1.style.display = prikazi ? 'block' : 'none';

            // Če prvo ocenjevanje NI prikazano, dodamo razred za skrivanje ozadja pri tisku
            const pdfKontejner = document.querySelector('.pdf-container');
            if (pdfKontejner) {
                if (prikazi) {
                    pdfKontejner.classList.remove('brez-ozadja');
                } else {
                    pdfKontejner.classList.add('brez-ozadja');
                }
            }
        }

        // Pomožna funkcija za prikaz/skrivanje dodatnega sklopa
        function nastaviDodatno(prikazi) {
            if (kontejnerDodatni) kontejnerDodatni.style.display = prikazi ? 'block' : 'none';
            if (poljeDatum2) poljeDatum2.style.display = prikazi ? 'block' : 'none';
        }

        if (chkPrvo && chkDodatno) {
            // Začetno stanje ob nalaganju strani
            chkPrvo.checked = true;
            nastaviPrvo(true);

            chkDodatno.checked = false;
            nastaviDodatno(false);

            // Dogodek ob spremembi PRVEGA stikala
            chkPrvo.addEventListener('change', (e) => {
                const isChecked = e.target.checked;
                nastaviPrvo(isChecked);

                // Če odkljukamo prvo ocenjevanje, avtomatsko obkljukamo drugo
                if (!isChecked) {
                    chkDodatno.checked = true;
                    nastaviDodatno(true);
                }
            });

            // Dogodek ob spremembi DRUGEGA stikala
            chkDodatno.addEventListener('change', (e) => {
                nastaviDodatno(e.target.checked);
            });
        }

        // 2. SAMODEJNI DATUM
        if (poljeDatum1) {
            const danes = new Date();
            const dan = String(danes.getDate()).padStart(2, '0');
            const mesec = String(danes.getMonth() + 1).padStart(2, '0'); 
            const leto = danes.getFullYear();
            const formatiranDatum = `${dan}.${mesec}.${leto}`;
            
            poljeDatum1.value = formatiranDatum;
            if (poljeDatum2) poljeDatum2.value = formatiranDatum;
        }

        // 3. KONFIGURACIJA IN LOGIKA PREMIKANJA
        const kontejner = document.querySelector('.pdf-container');
        if (!kontejner) return;

        const triPozicije = ['3', '4', '6', '9', '10', '12', '16', '19', '20',
                             '23', '24', '26', '29', '30', '32', '36', '39', '40'];
        const pozicije3 = [0, -75, -135];
        const pozicije2 = [0, -135];

        // Funkcija za avtomatski premik zadnjega krogca (20 ali 40)
        function posodobiZadnjiKrogec(startId, endId, zadnjiId) {
            const krogci = document.querySelectorAll('.krogec-oznaka');
            let ima135 = false;
            let ima75 = false;

            krogci.forEach(krogec => {
                const idNum = parseInt(krogec.id.replace('krogec-', ''));
                if (idNum >= startId && idNum < endId) {
                    const premik = parseInt(krogec.dataset.premikVrednost) || 0;
                    if (premik === -135) ima135 = true;
                    if (premik === -75) ima75 = true;
                }
            });

            const zadnjiKrogec = document.getElementById(`krogec-${zadnjiId}`);
            if (!zadnjiKrogec) return;

            let novPremik = 0;
            if (ima135) novPremik = -135;
            else if (ima75) novPremik = -75;

            zadnjiKrogec.dataset.premikVrednost = novPremik;
            zadnjiKrogec.style.transition = 'transform 0.3s ease-in-out';
            zadnjiKrogec.style.transform = `translateX(${novPremik}px)`;
        }

        // Klik dogodek na krogce
        kontejner.addEventListener('click', (dogodek) => {
            const kliknjenKrogec = dogodek.target.closest('.krogec-oznaka');

            if (kliknjenKrogec) {
                if (kliknjenKrogec.id === 'krogec-20' || kliknjenKrogec.id === 'krogec-40') return;

                const krogecId = kliknjenKrogec.id.replace('krogec-', '');
                const trenutneMoznePozicije = triPozicije.includes(krogecId) ? pozicije3 : pozicije2;

                let trenutniIndeks = parseInt(kliknjenKrogec.dataset.indeksPolja) || 0;
                trenutniIndeks = (trenutniIndeks + 1) % trenutneMoznePozicije.length;
                
                const novPremik = trenutneMoznePozicije[trenutniIndeks];
                
                kliknjenKrogec.dataset.indeksPolja = trenutniIndeks;
                kliknjenKrogec.dataset.premikVrednost = novPremik;
                
                kliknjenKrogec.style.transition = 'transform 0.2s ease-in-out';
                kliknjenKrogec.style.transform = `translateX(${novPremik}px)`;

                // Osvežimo 20-ko in 40-ko
                posodobiZadnjiKrogec(1, 20, 20);
                posodobiZadnjiKrogec(21, 40, 40);
            }
        });
    }); 
    </script>
</head>

            <!-- Drugi set krogcev (21-40) -->
